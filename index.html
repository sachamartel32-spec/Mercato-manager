<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mercato Manager</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#0e1a14;--sf:#17261d;--sf2:#1f3226;--tx:#eef5ef;--mut:#93a89a;--ac:#34d17a;--wr:#f0b429;--er:#ef5b5b;--bd:#2a4132}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef4ef;--sf:#fff;--sf2:#e4eee7;--tx:#14261b;--mut:#5d7366;--ac:#12a354;--bd:#cfdcd3}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bud{font-size:22px;font-weight:800;color:var(--ac)}.sm{font-size:12px;color:var(--mut)}
main{padding:12px 14px}h2{margin:6px 0 10px;font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:11px 0;font-size:13px;font-weight:600}
nav button.on{color:var(--ac);border-top:2px solid var(--ac)}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.ov{min-width:46px;height:56px;border-radius:8px 8px 22px 22px;background:linear-gradient(160deg,var(--wr),#b67a0c);color:#1b1200;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:18px;line-height:1}
.ov small{font-size:10px;font-weight:700}
.pi{flex:1;min-width:0}.pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.mn{flex:1;background:var(--sf2);border-radius:8px;padding:10px;font-size:13px;font-weight:700;text-align:center}
input,select{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:15px;width:100%}
.row input{flex:1}
.bt{background:var(--ac);color:#04200f;border:0;border-radius:8px;padding:11px 14px;font-weight:800;font-size:14px}
.bt.g{background:var(--sf2);color:var(--tx)}.bt.w{width:100%}
.tm{color:var(--wr);font-weight:800}.ok{color:var(--ac)}.ko{color:var(--er)}
.pitch{background:linear-gradient(var(--sf),var(--sf2));border-radius:12px;padding:8px;margin-bottom:12px}
.ln{display:flex;justify-content:space-around;margin:8px 0}
.mini{width:70px;text-align:center;font-size:11px;cursor:pointer}.mini b{display:block;font-size:15px;color:var(--wr)}
.mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal>div{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar i{flex:1;height:8px;background:var(--sf2);border-radius:4px;overflow:hidden}.bar u{display:block;height:100%;background:var(--ac)}.bar span:first-child{width:56px;color:var(--mut)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sf2)}
.sc{text-align:center;font-size:42px;font-weight:900;margin:6px 0}
.feed{max-height:220px;overflow:auto;font-size:14px}.feed div{padding:5px 0;border-bottom:1px solid var(--bd)}
.msg{background:var(--sf2);border-left:3px solid var(--ac);padding:8px 10px;border-radius:6px;margin-bottom:6px;font-size:13px}
.lg{display:grid;gap:10px;margin-top:14px}
.chip{display:inline-block;margin:2px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd)}
.tg{font-size:13px;font-weight:700;margin:6px 2px 0}.mini small{display:block;font-size:10px;color:var(--mut)}nav button{font-size:11px!important}
.tg{font-size:13px;font-weight:700;margin:6px 2px 0}.mini small{display:block;font-size:10px;color:var(--mut)}nav button{font-size:11px!important}.chip{display:inline-block}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd)}.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1}
</style></head><body>
<header><div><div class="sm" id="hl"></div><div class="bud" id="hb"></div></div><div class="sm" id="hr" style="text-align:right"></div></header>
<main id="v"><p class="sm">Chargement…</p></main><nav id="nv"></nav>
<div id="modal" onclick="if(event.target===this)cm()"><div id="mb"></div></div>
<script>
const LG=["Ligue 1","Premier League","LaLiga","Serie A","Bundesliga"];
let T="";try{T=localStorage.getItem("mmt")||""}catch(e){}
let seen="",notified="";try{seen=localStorage.getItem("mmb")||""}catch(e){}
let G=null,S={tab:"team",f:"Tous",msgs:[],mode:"join"},skew=0,last="";
const $=id=>document.getElementById(id),now=()=>Date.now()+skew;
const E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fm=n=>(n>=10?n.toFixed(1):n.toFixed(2)).replace(".",",")+" M€";
const fmt=end=>{const ms=end-now();if(ms<=0)return"Terminé";const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h?`${h} h ${String(m).padStart(2,"0")} min`:`${m} min ${String(Math.floor(ms%6e4/1e3)).padStart(2,"0")} s`};
const foc=()=>/INPUT|SELECT/.test(document.activeElement.tagName);
function msg(t){S.msgs.unshift(t);S.msgs=S.msgs.slice(0,3);render(1);setTimeout(()=>{S.msgs.pop();if(!foc())render(1)},6000)}
async function api(p,b){try{const r=await fetch("/api/"+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:T,...b})}),j=await r.json();
  if(r.status===401&&T){T="";G=null;render(1);return j}
  if(j.err)msg(j.err);if(j.state)setG(j.state);return j}catch(e){msg("Connexion perdue")}}
const unseen=()=>G&&G.batch&&G.batch.end>now()&&G.batch.id!==seen;
function checkBatch(){const b=G.batch;document.title=(unseen()?"(5) ":"")+"Mercato Manager";
  if(unseen()&&notified!==b.id){notified=b.id;if("Notification"in window&&Notification.permission==="granted"&&document.hidden){try{new Notification("Mercato Manager",{body:"5 nouveaux joueurs aux enchères : "+b.names.join(", ")});navigator.vibrate&&navigator.vibrate(200)}catch(e){}}}}
function markSeen(){if(G&&G.batch){seen=G.batch.id;try{localStorage.setItem("mmb",seen)}catch(e){}}document.title="Mercato Manager"}
function setG(s){skew=s.now-Date.now();G=s;checkBatch();const k=JSON.stringify({...s,now:0});if(k!==last){last=k;if(!foc())render(1)}}
async function poll(){if(!T)return;try{const r=await fetch("/api/state?token="+T);if(r.status===401){T="";try{localStorage.removeItem("mmt")}catch(e){}G=null;render(1);return}setG(await r.json())}catch(e){}}
async function auth(kind){const name=$("pn").value,pin=$("pp").value,lg=S.mode==="join"?S.lg:undefined;
  if(kind==="join"&&!lg)return msg("Choisis un championnat");
  const j=await api(kind,{name,pin,lg,token:""});if(j&&j.token){T=j.token;try{localStorage.setItem("mmt",T)}catch(e){}poll()}}
function head(){if(!G){$("hl").textContent="Mercato Manager";$("hb").textContent="";$("hr").textContent="";return}
  const m=G.me;$("hl").textContent=m.name+" · "+m.lg;$("hb").textContent=fm(m.avail);$("hr").innerHTML=`${m.W}V ${m.D}N ${m.L}D<br>${m.pts} pts`}
function render(){
  head();
  if(!G){$("nv").innerHTML="";$("v").innerHTML=`<h2>Mercato Manager</h2><p class="sm">Jeu d’enchères et de coaching de football, à jouer avec tes amis.</p><div class="tabs"><button class="bt ${S.mode==="join"?"":"g"}" onclick="S.mode='join';render(1)">Nouveau coach</button><button class="bt ${S.mode==="login"?"":"g"}" onclick="S.mode='login';render(1)">J’ai un compte</button></div><div style="display:grid;gap:8px"><input id="pn" placeholder="Pseudo" maxlength="16"><input id="pp" placeholder="Code secret à 4 chiffres" inputmode="numeric" maxlength="4">${S.mode==="join"?`<p class="sm">Choisis ton championnat : c’est celui de tes adversaires. Tu peux acheter des joueurs de n’importe quel championnat.</p><div class="lg" style="margin:0">${LG.map(l=>`<button class="bt ${S.lg===l?"":"g"}" onclick="S.lg='${l}';render(1)">${l}</button>`).join("")}</div><button class="bt" onclick="auth('join')">Créer mon équipe</button>`:`<button class="bt" onclick="auth('login')">Reprendre ma partie</button>`}</div>${S.msgs.map(x=>`<div class="msg" style="margin-top:10px">${E(x)}</div>`).join("")}`;return}
  $("nv").innerHTML=[["team","👕 Équipe"],["auc","🔨 Enchères"+(unseen()?" 🔴":"")],["match","⚽ Matchs"],["sell","💰 Reventes"],["rank","🏆 Top"]].map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");
  $("v").innerHTML=(unseen()?`<div class="msg" style="border-color:var(--wr)">🔔 <b>5 nouveaux joueurs</b> aux enchères : ${G.batch.names.map(E).join(", ")}<div class="row"><button class="bt" style="flex:1" onclick="go('auc')">Voir les enchères</button></div></div>`:"")+S.msgs.map(x=>`<div class="msg">${E(x)}</div>`).join("")+({team:vTeam,auc:vAuc,match:vMatch,sell:vSell,rank:vRank}[S.tab])()}
function go(t){S.tab=t;if(t==="auc")markSeen();render(1)}
function card(p,x,oc){return `<div class="pc" onclick="${oc||`sp(${p.id})`}"><div class="ov" style="font-size:15px">${p.pos}</div><div class="pi"><div class="pn">${p.new?"🆕 ":""}${E(p.n)}</div><div class="sm">${E(p.club)} · ${E(p.lg)}</div><div class="sm">Note ${p.ovr} · Valeur ${fm(p.value)}${p.form?` · Forme ${p.form.toFixed(1)}`:""}</div></div>${x||""}</div>`}
const STN=["Vitesse","Tir","Passe","Défense","Physique"];
const findP=id=>G.me.squad.find(p=>p.id===id)||G.auctions.map(a=>a.p).concat(G.listings.map(l=>l.p)).find(p=>p.id===id);
function sp(id){const p=findP(id);if(!p)return;const mine=G.me.squad.some(q=>q.id===id);if(p.new)api("seen",{pid:id});
  $("mb").innerHTML=`<div style="display:flex;gap:12px;align-items:center"><div class="ov" style="height:70px;min-width:58px;font-size:20px">${p.pos}</div><div><h2 style="margin:0">${E(p.n)}</h2><div class="sm">${E(p.club)} · ${E(p.lg)}</div><div class="sm">Note ${p.ovr} · Valeur ${fm(p.value)} · Base ${fm(p.price)}</div></div></div><div style="margin:12px 0">${p.st.map((v,i)=>`<div class="bar"><span>${p.pos==="GK"&&i==3?"Arrêts":STN[i]}</span><i><u style="width:${v}%"></u></i><b>${v}</b></div>`).join("")}</div>${mine?`<div class="row"><input id="pnum" type="number" min="1" max="99" value="${p.num}"><button class="bt" onclick="api('num',{pid:${id},num:$('pnum').value});cm()">Changer le numéro</button></div><button class="bt g w" style="margin-top:8px" onclick="cm();go('sell')">Revendre</button>`:""}<button class="bt g w" style="margin-top:8px" onclick="cm()">Fermer</button>`;$("modal").style.display="flex"}
function cm(){$("modal").style.display="none"}
function vTeam(){
  const m=G.me,row=k=>`<div class="ln">${m.slots.map((s,i)=>[s,i]).filter(([s])=>s[0]===k).map(([s,i])=>{const p=m.squad.find(q=>q.id===m.xi[i]);return p?`<div class="mini" onclick="slot(${i})"><b>${s[1]}</b><span>${E(p.n)}</span><small>Note ${p.ovr}</small></div>`:`<div class="mini" onclick="slot(${i})"><b>+</b><small>${s[1]}</small></div>`}).join("")}</div>`,bench=m.squad.filter(p=>!m.xi.includes(p.id));
  return `<select onchange="api('fm',{fm:this.value})">${["4-3-3","4-4-2","3-5-2"].map(f=>`<option ${f===m.fm?"selected":""}>${f}</option>`).join("")}</select><p class="sm">Touche un joueur du terrain pour le remplacer.</p><div class="pitch">${row("ATT")}${row("MID")}${row("DEF")}${row("GK")}</div><h2>Remplaçants (${bench.length})</h2><div style="display:grid;gap:8px">${bench.map(p=>card(p)).join("")||'<div class="sm">Aucun remplaçant.</div>'}</div>`}
function slot(i){const m=G.me,s=m.slots[i];
  $("mb").innerHTML=`<h2>Choisir ${s[1]}</h2><div style="display:grid;gap:8px">${m.squad.slice().sort((a,b)=>(b.pos===s[0])-(a.pos===s[0])||b.ovr-a.ovr).map(p=>card(p,p.pos!==s[0]?`<span class="sm">hors poste</span>`:"",`api('slot',{i:${i},pid:${p.id}});cm()`)).join("")}</div><button class="bt g w" style="margin-top:10px" onclick="cm()">Annuler</button>`;$("modal").style.display="flex"}
function vAuc(){
  const L=G.auctions.filter(a=>S.f==="Tous"||a.p.lg===S.f).sort((x,y)=>(x.end<now())-(y.end<now())||x.end-y.end);
  return (("Notification"in window&&Notification.permission==="default")?`<button class="bt g w" style="margin-bottom:10px" onclick="Notification.requestPermission().then(()=>render(1))">🔔 Activer les notifications</button>`:"")+`<select onchange="S.f=this.value;render(1)">${["Tous",...LG,"Autres"].map(l=>`<option ${l===S.f?"selected":""}>${l}</option>`).join("")}</select><div style="height:10px"></div>`+(L.map(a=>{
    const end=a.end<=now(),tag=end?(a.lead==="me"?`<div class="tg ok">Gagné</div>`:a.bidded?`<div class="tg ko">Perdu</div>`:`<div class="tg sm">Terminé</div>`):a.lead==="me"?`<div class="tg ok">Tu mènes</div>`:a.bidded?`<div class="tg ko">Surenchéri</div>`:a.lead?`<div class="tg sm">Meneur : ${E(a.ln)}</div>`:"";
    return `<div class="box">${card(a.p,`<div class="tm" data-end="${a.end}">${fmt(a.end)}</div>`)}${tag}${end?"":`<div class="row"><div class="mn">min : ${fm(a.min)}</div><input id="b${a.id}" inputmode="decimal" placeholder="Ta mise (M€)"><button class="bt" onclick="api('bid',{id:'${a.id}',amount:$('b${a.id}').value.replace(',','.')})">Surenchérir</button></div>`}</div>`}).join("")||'<p class="sm">Les enchères arrivent…</p>')}
function vSell(){
  const m=G.me,listed=new Set(G.listings.filter(l=>l.sid===m.id).map(l=>l.p.id)),mine=m.squad.filter(p=>!listed.has(p.id));
  return `<h2>Marché des joueurs</h2>`+(G.listings.filter(l=>l.sid!==m.id).map(l=>`<div class="box">${card(l.p,`<div class="tm">${fm(l.price)}</div>`)}<div class="row"><span class="sm" style="flex:1">Vendeur : ${E(l.sn)}</span><button class="bt" onclick="api('buy',{id:'${l.id}'})">Acheter</button></div></div>`).join("")||'<p class="sm">Aucune offre pour le moment.</p>')+`<h2>Mes ventes</h2>`+(G.listings.filter(l=>l.sid===m.id).map(l=>`<div class="box">${card(l.p,`<div class="tm">${fm(l.price)}</div>`)}<button class="bt g w" style="margin-top:8px" onclick="api('unsell',{id:'${l.id}'})">Retirer</button></div>`).join("")||'<p class="sm">Rien en vente.</p>')+`<h2>Mon effectif</h2>`+mine.map(p=>`<div class="box">${card(p)}<div class="row"><input id="sp${p.id}" inputmode="decimal" placeholder="Prix (valeur ${fm(p.value)})"><button class="bt" onclick="api('sell',{pid:${p.id},price:$('sp${p.id}').value.replace(',','.')})">Vendre</button></div></div>`).join("")}
function vRank(){const k=G.pos;
  return `<h2>Classement</h2><div class="box"><b>Tu es ${k}${k===1?"er":"e"} sur ${G.total}</b></div><table><tr><th>#</th><th>Coach</th><th>V-N-D</th><th>Pts</th><th>Fortune</th></tr>${G.rank.map((p,i)=>`<tr ${p.id===G.me.id?'style="color:var(--ac);font-weight:700"':""}><td>${i+1}</td><td>${E(p.name)}<div class="sm">${E(p.lg)}</div></td><td>${p.W}-${p.D}-${p.L}</td><td>${p.pts}</td><td>${fm(p.w)}</td></tr>`).join("")}</table>`}
function vMatch(){
  const m=G.match;let h="";
  if(G.me.note&&!m)h+=`<div class="msg">${E(G.me.note)}</div>`;
  if(m&&m.status==="open")h+=`<div class="box"><h2>En attente d’un adversaire…</h2><p class="sm">Dès qu’un coach te rejoint, le match de 6 minutes démarre.</p><button class="bt g w" onclick="api('cancel',{})">Annuler</button></div>`;
  else if(m){const e=(now()-m.t0)/1000,mn=m.done?90:Math.min(90,Math.floor(e<180?e/4:e<181?45:45+(e-181)/4)),sh=m.ev.filter(x=>x.m<=mn),a=sh.filter(x=>!x.s).length,b=sh.length-a;
    h+=`<div class="box"><div class="sm" style="text-align:center">${m.done?"Match terminé":e>=180&&e<181?"Mi-temps":mn+"’"}</div><div class="sc">${a} – ${b}</div><div class="sm" style="text-align:center">${E(m.an)} vs ${E(m.bn)}</div><div class="feed">${sh.slice().reverse().map(x=>`<div>${x.m}’ ⚽ ${E(x.n)} (${E(x.s?m.bn:m.an)})</div>`).join("")||"<div class='sm'>Match en cours…</div>"}</div>${m.done?`<div class="msg" style="margin-top:8px">${E(G.me.note)}</div><button class="bt w" style="margin-top:10px" onclick="api('ack',{})">Continuer</button>`:""}</div>`}
  if(!m||m.status==="open"){const o=G.me.opp;
    h+=`<div class="box"><div class="sm">Prochain match · ${E(G.me.lg)}</div><h2>${E(G.me.name)} vs ${E(o.n)}</h2><div class="sm">Adversaire ${o.s}</div><button class="bt w" style="margin-top:10px" onclick="api('bot',{})">▶ Simuler le match</button></div>`;
    if(!m)h+=`<div class="box"><h2>Défier un autre coach</h2><button class="bt g w" onclick="api('create',{})">Créer un match en ligne</button>${G.open.map(x=>`<div class="row"><div class="mn">${E(x.an)}</div><button class="bt" onclick="api('join_m',{id:'${x.id}'})">Rejoindre</button></div>`).join("")}</div>`}
  return h}
setInterval(poll,2000);poll();render(1);
setInterval(()=>{document.querySelectorAll("[data-end]").forEach(e=>{e.textContent=fmt(+e.dataset.end)});if(G&&S.tab==="match"&&G.match&&G.match.status==="live"&&!G.match.done&&!foc())render(1)},1000);
</script></body></html>
